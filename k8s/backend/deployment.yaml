apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend             
  namespace: app-prod      
  labels:
    app: backend            
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend          
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: xdn73/backend:v3          
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: backend-config       # ConfigMap للإعدادات العامة
          env:
            - name: SPRING_DATASOURCE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SPRING_DATASOURCE_URL
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: JWT_SECRET
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
