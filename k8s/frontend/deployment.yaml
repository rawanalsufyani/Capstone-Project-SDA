# frontend-deployment.yaml المعدل
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      # add Node Selector to be only in usernode not system
      nodeSelector:
        agentpool: usernode
      containers:
      - name: frontend
        image: xdn73/frontend:v3
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: frontend-config